<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кто ты, Герой?</title>
    
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,700;1,500&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle, #1a050a 0%, #050102 100%);
            font-family: 'Cormorant', serif;
            color: #EDD4AE;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .auth-container {
            position: relative;
            width: 100%;
            max-width: 400px;
            height: 100vh;
            max-height: 800px;
            background-color: #1a1a1a;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="400" height="400" opacity="0.12"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" stitchTiles="stitch"/></filter><rect width="400" height="400" filter="url(%23n)"/></svg>'), 
                              linear-gradient(135deg, #1c1c1c 0%, #111111 100%);
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.95), 0 0 60px rgba(0, 0, 0, 0.85);
            border: 1px solid #362e29;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 30px;
            box-sizing: border-box;
        }

        @media (min-width: 480px) {
            .auth-container {
                height: auto;
                border-radius: 4px;
            }
        }

        .auth-title {
            font-family: 'Cormorant', serif;
            font-weight: 700;
            font-size: 36px;
            color: #EDD4AE;
            margin: 0 0 45px 0;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
            text-align: center;
            letter-spacing: 1px;
        }

        .auth-form {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .input-label {
            font-family: 'Cormorant', serif;
            font-weight: 500;
            font-style: italic;
            font-size: 18px;
            color: #8c7d6b;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            width: 100%;
            max-width: 260px;
            display: flex;
            align-items: center;
        }

        .input-wrapper input {
            width: 100%;
            background-color: #0b0b0b;
            border: 1.5px solid #4a3f35;
            padding: 10px 15px;
            color: #FFF;
            font-family: 'Cormorant', serif;
            font-size: 20px;
            text-align: center;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-wrapper input:focus {
            border-color: #8c2525;
            box-shadow: 0 0 10px rgba(140, 37, 37, 0.3);
        }

        .input-decor {
            position: absolute;
            width: 21px;
            height: 39px;
            top: calc(50% - 19.5px); 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-decor.left {
            left: -20px;
            transform: scaleX(-1);
        }

        .input-decor.right {
            right: -20px;
        }

        .btn-submit {
            position: relative;
            width: 100%;
            max-width: 220px;
            margin: 25px auto 0 auto;
            padding: 14px;
            background: linear-gradient(to bottom, #80121a 0%, #40050a 100%);
            border: 1px solid #a6242e;
            color: #ffffff;
            font-family: 'Cormorant', serif;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 3px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            transition: all 0.2s ease;
        }

        .btn-submit:hover {
            background: linear-gradient(to bottom, #991922 0%, #540810 100%);
            box-shadow: 0 4px 20px rgba(166, 36, 46, 0.25);
        }

        .btn-submit:active {
            transform: scale(0.98);
            background: linear-gradient(to bottom, #40050a 0%, #210205 100%);
        }

        .btn-submit:disabled {
            background: #2b2626;
            border-color: #4a4242;
            color: #5a5252;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-corner.top-left { top: -5px; left: -5px; transform: rotate(180deg); }
        .btn-corner.top-right { top: -5px; right: -5px; transform: rotate(270deg); }
        .btn-corner.bottom-right { bottom: -5px; right: -5px; transform: rotate(0deg); }
        .btn-corner.bottom-left { bottom: -5px; left: -5px; transform: rotate(90deg); }

        /* ИНДИКАТОР ЗАГРУЗКИ: Скрыт по умолчанию */
        .status-text {
            font-size: 18px;
            font-style: italic;
            color: #a69076;
            margin-top: 40px;
            letter-spacing: 1px;
            text-align: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }

        /* Класс активации индикатора */
        .status-text.visible {
            opacity: 0.8;
            visibility: visible;
            animation: pulseGlow 2s infinite ease-in-out;
        }

        /* Эффект мягкого мигания во время поиска */
        @keyframes pulseGlow {
            0% { opacity: 0.4; text-shadow: 0 0 5px rgba(237, 212, 174, 0.1); }
            50% { opacity: 0.9; text-shadow: 0 0 15px rgba(237, 212, 174, 0.4); }
            100% { opacity: 0.4; text-shadow: 0 0 5px rgba(237, 212, 174, 0.1); }
        }
    </style>
</head>

<body>

    <div class="auth-container">
        <h1 class="auth-title">Кто ты, Герой?</h1>

        <form class="auth-form" id="loginForm">
            
            <!-- Поле ввода: Имя -->
            <div class="input-group">
                <label class="input-label">имя мне:</label>
                <div class="input-wrapper">
                    <div class="input-decor left">
                        <svg width="21" height="39" viewBox="0 0 21 39" fill="none" xmlns="http://w3.org">
                            <path d="M6.0687 37.75V33.2827L19.0607 19.3407L6.06067 5.14237V0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                            <path d="M1.06067 19.2776L5.797 14.5413L10.5333 19.2776L5.797 24.0139L1.06067 19.2776Z" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                        </svg>
                    </div>
                    
                    <input type="text" id="username" required autocomplete="off">
                    
                    <div class="input-decor right">
                        <svg width="21" height="39" viewBox="0 0 21 39" fill="none" xmlns="http://w3.org">
                            <path d="M6.0687 37.75V33.2827L19.0607 19.3407L6.06067 5.14237V0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                            <path d="M1.06067 19.2776L5.797 14.5413L10.5333 19.2776L5.797 24.0139L1.06067 19.2776Z" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Поле ввода: Кодовое слово -->
            <div class="input-group">
                <label class="input-label">кодовое слово:</label>
                <div class="input-wrapper">
                    <div class="input-decor left">
                        <svg width="21" height="39" viewBox="0 0 21 39" fill="none" xmlns="http://w3.org">
                            <path d="M6.0687 37.75V33.2827L19.0607 19.3407L6.06067 5.14237V0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                            <path d="M1.06067 19.2776L5.797 14.5413L10.5333 19.2776L5.797 24.0139L1.06067 19.2776Z" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                        </svg>
                    </div>
                    
                    <input type="password" id="secretWord" required>
                    
                    <div class="input-decor right">
                        <svg width="21" height="39" viewBox="0 0 21 39" fill="none" xmlns="http://w3.org">
                            <path d="M6.0687 37.75V33.2827L19.0607 19.3407L6.06067 5.14237V0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                            <path d="M1.06067 19.2776L5.797 14.5413L10.5333 19.2776L5.797 24.0139L1.06067 19.2776Z" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Кнопка подтверждения -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <div class="btn-corner top-left"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://w3.org"><path d="M15.9595 3.79119V15.9091H4.15889" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M15.6013 9.85017H10.0592V15.9091" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M19.0102 0.75V18.75H0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/></svg></div>
                <div class="btn-corner top-right"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://w3.org"><path d="M15.9595 3.79119V15.9091H4.15889" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M15.6013 9.85017H10.0592V15.9091" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M19.0102 0.75V18.75H0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/></svg></div>
                <div class="btn-corner bottom-right"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://w3.org"><path d="M15.9595 3.79119V15.9091H4.15889" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M15.6013 9.85017H10.0592V15.9091" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M19.0102 0.75V18.75H0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/></svg></div>
                <div class="btn-corner bottom-left"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://w3.org"><path d="M15.9595 3.79119V15.9091H4.15889" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M15.6013 9.85017H10.0592V15.9091" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/><path d="M19.0102 0.75V18.75H0.75" stroke="#EDD4AE" stroke-width="1.5" stroke-miterlimit="10" stroke-linecap="round"/></svg></div>
                <span>ВОЙТИ</span>
            </button>

        </form>

        <p class="status-text" id="statusMessage">ищем вас в списке...</p>
    </div>

    <!-- Встроенные скрипты обработки событий -->
        <!-- Встроенные скрипты обработки событий -->
          <!-- Встроенные скрипты обработки событий и переключения экранов -->
    <script>
        // Функция для полной замены интерфейса на игровой экран
        function switchToGame(charSheetName) {
            const statusMsg = document.getElementById('statusMessage');
            statusMsg.textContent = "загрузка боевого движка...";

            google.script.run
                .withSuccessHandler(function(htmlContent) {
                    document.body.innerHTML = htmlContent;
                    
                    if (typeof initGameUI === 'function') {
                        initGameUI(charSheetName);
                    } else if (typeof updateBarsUI === 'function') {
                        updateBarsUI();
                    }
                })
                .withFailureHandler(function(err) {
                    statusMsg.textContent = "ошибка материализации игрового мира.";
                    console.error("Ошибка загрузки экрана игры:", err);
                })
                .loadGameScreen();
        }

        // Обработка отправки формы авторизации
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const secretWord = document.getElementById('secretWord').value;
            const statusMsg = document.getElementById('statusMessage');
            const submitBtn = document.getElementById('submitBtn');

            statusMsg.textContent = "ищем вас в списке...";
            statusMsg.classList.add('visible');
            submitBtn.disabled = true;

            google.script.run
                .withSuccessHandler(function(response) {
                    if (response && response.success) {
                        statusMsg.textContent = "доступ разрешен. входим...";
                        
                        localStorage.setItem('combat_engine_username', response.username);
                        
                        let targetSheet = "";
                        // ИСПРАВЛЕНО: Правильное чтение из массива персонажей [0]
                        if (response.characters && response.characters.length > 0) {
                            targetSheet = response.characters[0].sheetName;
                            localStorage.setItem('combat_engine_active_sheet', targetSheet);
                        }

                        setTimeout(function() {
                            switchToGame(targetSheet);
                        }, 800);

                    } else {
                        statusMsg.textContent = response ? response.message : "Неизвестная ошибка сервера.";
                        submitBtn.disabled = false;
                    }
                })
                .withFailureHandler(function(error) {
                    statusMsg.textContent = "ошибка связи с сервером душ.";
                    submitBtn.disabled = false;
                    console.error("Ошибка авторизации на сервере:", error);
                })
                .authenticateUser(username, secretWord);
        });

        // АВТО-ВХОД: Если игрок уже авторизован
        window.addEventListener('DOMContentLoaded', function() {
            const savedUser = localStorage.getItem('combat_engine_username');
            const savedSheet = localStorage.getItem('combat_engine_active_sheet');
            
            if (savedUser) {
                const statusMsg = document.getElementById('statusMessage');
                const submitBtn = document.getElementById('submitBtn');
                
                statusMsg.textContent = "пробуждение души...";
                statusMsg.classList.add('visible');
                submitBtn.disabled = true;

                google.script.run
                    .withSuccessHandler(function(response) {
                        if (response && response.success) {
                            statusMsg.textContent = "приветствуем снова...";
                            switchToGame(savedSheet);
                        } else {
                            localStorage.removeItem('combat_engine_username');
                            localStorage.removeItem('combat_engine_active_sheet');
                            statusMsg.classList.remove('visible');
                            submitBtn.disabled = false;
                        }
                    })
                    .withFailureHandler(function(err) {
                        statusMsg.classList.remove('visible');
                        submitBtn.disabled = false;
                        console.error("Ошибка авто-входа:", err);
                    })
                    .authenticateUserWithoutPassword(savedUser);
            }
        });
    </script>
</body>
</html>
